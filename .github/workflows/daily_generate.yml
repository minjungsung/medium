name: Daily generate Medium draft

on:
  schedule:
    # Every day 00:10 UTC
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: medium-daily-generation
  cancel-in-progress: false

jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-project-validation.yml
    permissions:
      contents: read
  generate:
    if: github.ref == 'refs/heads/main'
    needs: verify-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -r requirements.txt

      # GitHub Models (models.github.ai) was retired on 2026-07-30 and now answers every
      # request with a bare "OK", so the provider is selected from repository settings.
      # LLM_PROVIDER   (variable, default openai)
      # LLM_BASE_URL   (variable, optional: any OpenAI-compatible endpoint)
      # LLM_MODEL      (variable, default gpt-4o-mini)
      # LLM_API_KEY    (secret, fallback OPENAI_API_KEY)
      - name: Generate post
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          python src/generate_and_publish.py --action generate --allow-skip --outdir posts --site_dir site

      - name: Commit generated post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts site
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily generated post"
          git push origin HEAD:refs/heads/main
