name: Push Wiki
on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:
jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-project-validation.yml
    permissions:
      contents: read
  push-wiki:
    if: github.ref == 'refs/heads/main'
    needs: verify-publication
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Push wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d wiki ]; then echo "No wiki/ directory"; exit 0; fi
          git config --global user.email "minjungsung1994@gmail.com"
          git config --global user.name "minjungsung"
          TMPDIR=$(mktemp -d)
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$TMPDIR"
          cp wiki/*.md "$TMPDIR/"
          cd "$TMPDIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "docs: update wiki pages"
            git push
            echo "Wiki updated successfully"
          fi
