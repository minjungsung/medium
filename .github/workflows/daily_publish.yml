name: Daily Medium Publish

on:
  workflow_dispatch: {}

jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-project-validation.yml
    permissions:
      contents: read
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Run generator and publish
        env:
          # Many accounts cannot create Medium Integration Tokens anymore, so this workflow generates only.
          LLM_PROVIDER: github_models
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          python src/generate_and_publish.py --action generate --topic "Daily development insight - $(date -u +'%Y-%m-%d')" --outdir posts --site_dir site
