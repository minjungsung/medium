name: Daily Medium Publish

on:
  workflow_dispatch: {}

jobs:
  verify-publication:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/strict-project-validation.yml
    permissions:
      contents: read
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Run generator and publish
        env:
          # GitHub Models (models.github.ai) was retired on 2026-07-30, so the provider comes
          # from repository settings: LLM_PROVIDER / LLM_BASE_URL / LLM_MODEL (variables) and
          # LLM_API_KEY (secret, fallback OPENAI_API_KEY).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          python src/generate_and_publish.py --action generate --topic "Daily development insight - $(date -u +'%Y-%m-%d')" --outdir posts --site_dir site
